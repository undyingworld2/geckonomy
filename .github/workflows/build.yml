name: Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Docker is available on ubuntu-latest, so the Testcontainers MariaDB suites run here
      # rather than being skipped as they are on a machine without it.
      - name: Build and test
        run: ./mvnw -B clean package

      - uses: actions/upload-artifact@v4
        with:
          name: geckonomy-${{ github.sha }}
          path: target/geckonomy-*.jar
          if-no-files-found: error
